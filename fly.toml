app = "markitdown-api"

primary_region = "ams"  # e.g. ams, nrt, sgp; edit to your preferred region

kill_signal = "SIGTERM"
kill_timeout = 5

processes = []

[env]

[experimental]
allowed_public_ports = []
auto_rollback = true

[[services]]
  http_checks = []
  internal_port = 8000
  processes = ["app"]
  protocol = "tcp"
  script_checks = []

  [services.concurrency]
    hard_limit = 100
    soft_limit = 100

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    interval = 10000
    timeout = 2000
